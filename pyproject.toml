[project]
name = "tree_modeling"
description = "A Python package for reconstructing 3D tree geometries and computing tree- and streetscape-level metrics from segmented point clouds."
version = "0.0.1"
readme = "README.md"
authors = [{name = "Municipality of Rotterdam", email = "placeholder@rotterdam.nl"}]
requires-python = ">=3.11,<4.0"
dependencies = [
    "poetry-plugin-export (>=1.6.0,<2.0.0)",
    "python-dotenv (>=0.21.1,<0.22.0)",
    "azure-monitor-opentelemetry (>=1.6.4,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "tree_modeling", from = "src" }]

[tool.poetry.dependencies]
poetry-plugin-export = "^1.6.0"
ipykernel = "^6.21.0"
python-dotenv = "^0.21.1"
open3d = "0.18.0"
numpy = "1.24.3"
numba = "^0.61.0"
alphashape = "1.3.1"
laspy = {extras = ["laszip", "lazrs"], version = "^2.5.4"}
matplotlib = "3.10.0"
networkx = "2.8.8"
plyfile = "0.7.4"
pymeshfix = "0.16.1"
tqdm = "4.64.1"
trimesh = "3.17.1"
scikit-learn = "^1.6.0"
addict = "^2.4.0"
pillow = "^11.1.0"
shapely = "^2.0.7"
geopandas = "^1.0.1"
python-fcl = "^0.7.0.6"
vulture = "^2.14"
hdbscan = "0.8.39"

[tool.poetry.group.dev.dependencies]
pytest = "7.1.2"
wheel = "^0.38.4"
pylint = "2.13.8"
pyyaml = "^6.0"
azureml = "^0.2.7"
azure-identity = "^1.12.0"
pydocstyle = "^6.3.0"
tomli = "^2.0.1"
configargparse = "^1.7.1"

[tool.poetry.group.precommit.dependencies]
pre-commit = "3.4.0"

[tool.poetry.group.test.dependencies]
codecov = "^2.1.13"
mock = "^5.1.0"
pyodbc = "^5.1.0"
pytest = "7.1.2"
pytest-cov = "^4.0.0"
pytest-azurepipelines = "^1.0.4"
sqlalchemy = "^2.0.28"
open3d = "0.18.0"
addict = "^2.4.0"
numpy = "1.24.3"
scikit-learn = "^1.6.0"
pillow = "^11.1.0"
tqdm = "4.64.1"
laspy = {extras = ["laszip", "lazrs"], version = "^2.5.4"}
matplotlib = "3.10.0"
networkx = "2.8.8"
pymeshfix = "0.16.1"
shapely = "^2.0.7"
trimesh = "3.17.1"
alphashape = "1.3.1"
numba = "^0.61.0"
plyfile = "0.7.4"
geopandas = "^1.1.1"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
tomlq = "^0.1.0"
twine = "^6.1.0"
wheel = "^0.38.4"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.6"
sphinx-markdown-builder = "0.6.6"
msal = "^1.32.3"
azure-devops = "7.1.0b4"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"



[tool.mypy]
python_version = "3.11"
exclude = [".mypy_cache", ".tox", ".venv", "lib", "notebooks", "tests"]
disallow_any_decorated = true
disallow_any_generics = true
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true
strict_equality = true
warn_unused_configs = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "lib",
    "notebooks",
    "tests",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.11 (>=)
target-version = "py311"

# Allow fix for all enabled rules
fix = true

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s -p no:warnings"
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "[pytest][%(asctime)s][%(levelname)s][%(module)s][%(funcName)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_level = "INFO"
markers =[
    "onlylocal: marks tests as slow (deselect with '-m \"not onlylocal\"')",
    "serial"
]